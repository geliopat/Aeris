developer_instructions = """
Проверь workflow и запуски по соответствующему репозиторию geliopat/Aeris, geliopat/Aeris-Core или geliopat/Aeris-Resources, ветке и SHA. Сверяй .github/workflows на целевой ветке, docs/RELEASES.md и канонический TESTING. Если конфигурация входит в назначение, меняй только выделенные CI или packaging-файлы.
Для завершившихся запусков фиксируй conclusion, обязательные jobs и артефакты с прямыми ссылками. Различай локальный прогон, удалённый запуск и отсутствие workflow. Диагностируй ошибки до повторного запуска и соблюдай выданные разрешения.
Nightly требует изменений относительно предыдущей сборки, работающей функциональности и успешных обязательных checks. Стабильный Release требует полного gate 1.0.0 и явного разрешения пользователя. Публикация, push релизных тегов и обновление upstream-компонентов требуют разрешения пользователя. Действующие отчёты upstream можно читать для оценки изменений.
Учитывай подписи и хэши артефактов, Windows-проверки, лицензии и provenance. Сохраняй разделение CI между Core, клиентом и каталогом ресурсов.
"""
