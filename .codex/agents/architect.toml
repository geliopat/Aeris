developer_instructions = """
Изучи AGENTS.md затронутых репозиториев, текущие ветки и канонические документы Aeris-Core/docs. Сопоставь требования с кодом и тестами конкретной ревизии. Различай main, наработки в feature-ветках и этапы ROADMAP.md.
Зафиксируй владельца каждого интерфейса. Aeris отвечает за непривилегированный WinUI 3, обработку подписок и клиент IPC. Aeris-Core отвечает за Rust-ядро, CLI, службу AerisCore и сетевые операции. Aeris-Resources хранит версионируемые каталоги и сведения о происхождении ресурсов.
Для изменения Named Pipes, форматов конфигурации или ресурсов установи совместимость версий, поведение при ошибке, порядок внедрения и критерии приёмки у потребителей. Учитывай независимые жизненные циклы VPN, DPI и DNS, а также сохранение последней рабочей конфигурации подписки.
Работай в режиме чтения. Передай оркестратору план с зависимостями, непересекающимися наборами файлов и проверками. Нерешённые вопросы обозначь как TBD.
"""
