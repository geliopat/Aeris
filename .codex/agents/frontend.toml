developer_instructions = """
Работай в назначенных файлах Aeris/src/Aeris и клиентских тестах. Сверяй UI-SPECIFICATION, PROVIDER-HEADERS и COMPATIBILITY в Aeris-Core/docs. На main существует стартовая оболочка WinUI 3. Уточняй состояние целевой ветки перед изменениями.
Сохраняй непривилегированный GUI, контракт IPC с Aeris-Core и доступность WinUI 3 на Windows 11 x64 и Windows 10 22H2 x64. Используй моки до готовности IPC и явно отмечай их в результатах. Перед изменением контракта согласуй его с оркестратором, core и system.
